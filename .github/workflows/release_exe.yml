name: Release Windows Build

on:
  push:
    branches:
      - main

  # Lets the smoke test run against a branch without publishing anything: the release step
  # below is gated on a push to main.
  workflow_dispatch:

# The smoke test makes this job ~25 minutes instead of ~3, so two merges in quick
# succession can now overlap. Queue them rather than cancelling: the release step deletes
# the tag before recreating it, and a run cancelled inside that window would leave no
# release at all.
concurrency:
  group: release-windows-build
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          cache: 'pip'
          python-version: "3.9"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,test]

      - name: Build the executable
        run: pyinstaller --onefile --exclude demo dk-installer.py

      # Installs TestGen for real in pip mode, checks the app serves, kills the installer
      # and uninstalls. Deliberately ahead of the release step: the exe is the entry point
      # most Windows users take, and this is the one place it can still be gated -- a
      # failure here leaves the previous release in place instead of replacing it.
      - name: Smoke-test the executable
        run: python tests/e2e/smoke_exe.py dist/dk-installer.exe

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: smoke/
          if-no-files-found: ignore

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_TAG=latest
          gh release delete "${RELEASE_TAG}" -y || true
          git push origin --delete "${RELEASE_TAG}" || true
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" ./dist/dk-installer.exe \
            --title "Latest Release"
