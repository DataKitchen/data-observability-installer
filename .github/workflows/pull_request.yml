name: Pull Request Checks

on:
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  ruff:
    name: Lint with ruff
    uses: ./.github/workflows/python-job.yml
    with:
      run: |
        ruff check --show-fixes
        ruff format --check --diff

    secrets: inherit

  test:
    name: Run tests
    uses: ./.github/workflows/python-job.yml
    with:
      run: |
        set -o pipefail
        mkdir reports
        pytest --junit-xml=reports/pytest.xml --cov  --cov-report=term-missing | tee reports/coverage.txt
      artifact: pytest-results
      artifact_path: reports/
    secrets: inherit

  test-windows:
    name: Run tests on Windows
    uses: ./.github/workflows/python-job.yml
    with:
      runner: windows-latest
      run: |
        # tests/installer.py is a symlink to ../dk-installer.py. A Windows checkout
        # materializes it as a plain file holding the target path unless core.symlinks is
        # enabled, which turns `from tests.installer import ...` into a SyntaxError. Copy
        # over it when that is what we got; a real symlink is left alone.
        if [ ! -L tests/installer.py ]; then cp dk-installer.py tests/installer.py; fi
        pytest
    secrets: inherit

  report-coverage:
    name: Report tests coverage
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    needs: [test]
    steps:
      - name: Download Pytest results
        uses: actions/download-artifact@v4
        with:
          name: pytest-results
          path: reports

      - name: Add PR comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          junitxml-path: reports/pytest.xml
          pytest-coverage-path: reports/coverage.txt
          report-only-changed-files: true
